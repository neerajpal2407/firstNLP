name: Run first.py on Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-python:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || true  # in case you don't have one

    - name: Run first.py
      run: python first.py
